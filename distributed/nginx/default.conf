server {
    listen 80;
    server_name _;
    client_max_body_size 12m;

    location /api/auth/ {
        proxy_pass http://auth:8083;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
    }
    location /api/inventario/ {
        proxy_pass http://inventory:8081;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
    }
    location /api/ventas {
        proxy_pass http://sales:8082;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
    }
    # Conservar la API Sanctum de Laravel para el Proyecto 2.
    location = /api/reportes/ventas {
        proxy_pass http://app:8000;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/reportes/ {
        proxy_pass http://reports:8084;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
    }
    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
