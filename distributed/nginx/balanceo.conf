# Actualización 10: balanceo de las consultas de inventario entre dos procesos
# que comparten SOLO la BD de inventario_db (ambos requieren autenticación JWT).
upstream sisropa_inventory_cluster {
    server inventory:8081 max_fails=1 fail_timeout=5s;
    server inventory2:8081 max_fails=1 fail_timeout=5s;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 12m;

    location /api/auth/ {
        proxy_pass http://auth:8083;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
    }
    location /api/inventario/ {
        proxy_pass http://sisropa_inventory_cluster;
        proxy_http_version 1.1;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
        # Las solicitudes GET pueden reintentarse con otro nodo si el primero falla.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        # Evita que un nodo caído bloquee demasiado la consulta.
        proxy_connect_timeout 2s;
        proxy_send_timeout 5s;
        proxy_read_timeout 6s;
        proxy_next_upstream_timeout 9s;
        # Únicamente para demostrar la distribución local, no para producción.
        add_header X-SISROPA-Upstream $upstream_addr always;
    }
    location /api/ventas {
        proxy_pass http://sales:8082;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
    }
    location /api/reportes/pos/ {
        proxy_pass http://reports:8084;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
    }
    location /api/reportes/resumen {
        proxy_pass http://reports:8084;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
    }
    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
